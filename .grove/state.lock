d D-05 status=accepted t_created=2026-08-07T00:53:41Z t_updated=2026-08-07T00:55:30Z "Release signing runs in approval-gated GitHub Actions, not on an offline host"
  context:
    | the reference system's strongest invariant was 'CI never sees the signing key' (offline hardware host, PIV slots); Grove is a single-maintainer OSS project with no paid certificate story
  options:
    | OC1: offline hardware signing host like the reference; OC2: CI signing in GitHub Actions behind an environment approval gate; OC3: unsigned releases
  decision:
    | OC2: the sign job lives in the release environment with required reviewers; the RSA-2048 key exists only as an environment secret plus an offline backup; compensating controls: zero third-party actions in the sign job, SHA-pinned official actions, umask 077 key handling, no caches, no pull_request_target, workflow_dispatch only, dist/ transparency log, attestations; return to offline signing later needs no redesign, only where bin/sign.sh runs
  consequences:
    | a compromised session alone cannot sign: producing a valid signature requires a separate human approval click; the residual risk (an attacker who passes the GitHub hardening gates signs anything) is accepted and bounded by observability controls
  validation:
    | release-security-checks runbook per release; incident-response and rotate-signing-key runbooks exist (W-80)

d D-06 status=accepted t_created=2026-08-07T00:53:41Z t_updated=2026-08-07T00:56:01Z "trivy is the supply-chain scanner behind an in-repo policy wrapper"
  context:
    | Cargo and Julia Pkg offer no install-time scanner hook, so the reference's Bun scanner mechanism (policy enforced on every install) is not replicable; osv-scanner has no Julia Manifest.toml parser (verified against its supported-lockfiles list)
  options:
    | OC1: trivy behind an in-repo wrapper; OC2: osv-scanner for Cargo.lock plus a custom Julia fallback as the primary path; OC3: a custom scanner package; OC4: Dependabot only
  decision:
    | OC1: bin/audit.sh owns the policy (lockfiles, severity mapping CRITICAL/HIGH fatal, UNKNOWN warns, --fail-closed in release mode, VEX not_affected honored) and calls pinned trivy, which parses Cargo.lock and Manifest.toml natively (JLSEC advisories live in osv.dev); bin/audit.jl (osv.dev querybatch) remains the Julia fallback; enforcement moves to CI: PR checks fail open, release gate and weekly run fail closed
  consequences:
    | one engine covers both ecosystems; policy changes require a reviewed PR; a custom package would duplicate the engine for no install-hook benefit
  validation:
    | tests/audit fixture with a known JLSEC advisory is flagged; security-scan.yml weekly run

d D-07 status=accepted t_created=2026-08-07T00:53:41Z t_updated=2026-08-07T00:56:03Z "Rust binaries (grove, grove-mcp) are the primary release artifacts; Julia is a developer source install"
  context:
    | the original plan treated the Julia CLI as the user-facing artifact (Julia 1.10+ required on user machines, source bootstrap in install.sh); the Rust workspace already ships a full grove CLI (packages/core/src/bin/grove.rs) held byte-compatible with the Julia reference by the conformance corpus (Q-01: Rust is the MCP and desktop backend)
  options:
    | OC1: Julia source bootstrap as the user path; OC2: PackageCompiler binaries; OC3: Rust binaries as primary artifacts with Julia as a developer source install
  decision:
    | OC3: per-platform Rust binaries for grove and grove-mcp (later grove-desktop) are the release artifacts; no Julia runtime on user machines; the Julia package remains the reference implementation and a documented developer install
  consequences:
    | install.sh/install.ps1 become plain verified-unpack flows; the artifact matrix is 4 targets x 2 binaries plus desktop sets
  validation:
    | installers install all components on the CI matrix (bash 20/20, ps1 16/16); corpus byte-parity between implementations

d D-08 status=accepted t_created=2026-08-07T00:53:41Z t_updated=2026-08-07T13:50:42Z "Compliance scoped to non-commercial FOSS; CRA machinery dropped with documented revisit triggers"
  context:
    | the reference's compliance weight (ENISA 24h/72h/14d reporting, EU authorised representative, Declaration of Conformity, CE marking, Annex VII technical documentation with 10-year retention, on-request SBOM/VEX) stems from placing a commercial product on the EU market under the CRA (Regulation (EU) 2024/2847); Grove is MIT-licensed, free, and non-commercial
  options:
    | OC1: replicate the full CRA machinery; OC2: keep the engineering substance only; OC3: nothing
  decision:
    | OC2: SECURITY.md with response targets, signed public SBOM/VEX, support declaration, egress and telemetry honesty; the regulatory endpoints are dropped; revisit triggers: any monetization, commercial EU distribution, or becoming an open-source steward
  consequences:
    | no compliance theater; enterprise adopters still get machine-readable transparency; docs/security/compliance.md and annex-vii.md (W-80) record the analysis, the artifact inventory, and what full Annex VII would require
  validation:
    | compliance.md and annex-vii.md written in Phase 4 and kept current by the revisit triggers

d D-09 status=accepted t_created=2026-08-07T00:53:42Z t_updated=2026-08-07T00:56:39Z "Distribution only via GitHub Releases with a signed manifest as the trust anchor"
  context:
    | Grove is open source: no licenses, no JWT, no download authorization, no private infrastructure; the trust model still needs an anchor stronger than TLS alone
  options:
    | OC1: GitHub Releases plus a detached-signed manifest as the anchor; OC2: a gated CDN like the reference's Cloudflare Worker; OC3: unsigned releases over TLS
  decision:
    | OC1: two pinned origins (raw.githubusercontent.com for the bootstrap, github.com/.../releases/download for payloads); RSA-2048/PSS detached signatures, base64url; verify-then-parse, fail closed on every check; anti-rollback sequence plus MINIMUM_SEQUENCE and a 180-day expires_at; SHA256SUMS, SBOM, VEX, and both installers (install.sh bash, install.ps1 PowerShell) signed with the same key; byte-identical dist/ on main as the transparency log; attestations as a second, GitHub-backed verification path that never replaces the manifest
  consequences:
    | code-signing-grade assurance without buying certificates; the release key is the only secret; host compromise alone cannot install malicious bytes
  validation:
    | tests/install adversarial suite (tampered, expired, rollback, wrong host, hash mismatch, break-glass) on all CI legs; release-security-checks runbook per release

d D-10 status=accepted t_created=2026-08-07T13:50:41Z t_updated=2026-08-07T13:50:42Z "License changed from MIT to AGPL-3.0-only before the first release"
  context:
    | D-08 was written while Grove was MIT-licensed; before any release (and before external forks), the maintainer chose stronger copyleft so hosted/network use of Grove requires source disclosure
  options:
