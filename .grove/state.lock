    | OC1: hand-rolled parsing in the same crate; clap generates its own help and error text which cannot match Julia byte-for-byte
  consequences:
    | no new dependencies; help and usage text lives in the crate as data; the corpus becomes the executable specification of the whole CLI surface; implementation lands in waves: core semantics, then mutations with journal and render, then CLI and differential runner
  validation:
    | differential runner replays all 24 corpus scenarios through the Rust implementation byte-identically (same D-01 normalization)

